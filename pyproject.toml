[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowfield-benchmarks"
version = "0.8.0"
description = "Reproducible OpenFOAM flow-field optimization benchmarks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
optim = ["cma==4.5.0"]
random = ["numpy>=1.24", "scipy>=1.10"]
p003 = ["numpy>=1.24", "scipy>=1.10"]
bo = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]
plot = ["matplotlib>=3.7"]
p004-ml = ["numpy>=1.24"]
ioh = ["ioh==0.3.22"]
p001 = ["gmsh==4.13.1"]
p006 = ["scipy>=1.16,<1.19", "cmeel-eigen==3.4.1"]
p009 = ["gmsh==4.13.1", "numpy>=1.24", "scipy>=1.10"]
p008 = ["numpy>=1.24", "cmeel-eigen==3.4.1"]
p007 = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
flowfield-p009 = "flowfield.problems.level1_small_continuous.p009.cli:main"
flowfield-p008 = "flowfield.problems.level1_small_continuous.p008.cli:main"
flowfield-check = "flowfield.stability.cli:main"
flowfield-p007 = "flowfield.problems.level4_high_dimensional_topology.p007.cli:main"
flowfield-p005 = "flowfield.problems.level1_small_continuous.p005.cli:main"
flowfield-p006 = "flowfield.problems.level1_small_continuous.p006.cli:main"
flowfield-optimize = "flowfield.optimization:main"
flowfield-benchmark = "flowfield.benchmarking.runner:main"
flowfield-plot = "flowfield.benchmarking.plotting:main"
flowfield-p004 = "flowfield.problems.level3_discrete_combinatorial.p004.cli:main"
flowfield-p003 = "flowfield.problems.level4_high_dimensional_topology.p003.cli:main"
flowfield = "flowfield.cli:main"
flowfield-p002 = "flowfield.problems.level2_medium_parametric.p002.cli:main"
flowfield-p001 = "flowfield.problems.level2_medium_parametric.p001.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flowfield.problems.level2_medium_parametric.p002" = ["data/*.json", "solver/*.C", "solver/*.H", "solver/Make/files", "solver/Make/options"]

"flowfield.problems.level4_high_dimensional_topology.p003" = ["solver/*.C", "solver/Make/files", "solver/Make/options"]

"flowfield.problems.level3_discrete_combinatorial.p004" = ["data/*.json", "data/*.gz"]

"flowfield.problems.level1_small_continuous.p005" = ["monitor/*.C", "monitor/*.H", "monitor/Make/files", "monitor/Make/options", "data/*.json"]
"flowfield.problems.level1_small_continuous.p006" = ["solver/*.C", "solver/*.H", "solver/Make/files", "solver/Make/options"]
"flowfield.problems.level4_high_dimensional_topology.p007" = ["solver/*.C", "solver/Make/files", "solver/Make/options"]

"flowfield.problems.level1_small_continuous.p008" = ["solver/*.C", "solver/*.H", "solver/Make/files", "solver/Make/options"]
